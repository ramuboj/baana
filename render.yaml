services:
  - type: web
    name: baana-api
    runtime: node
    plan: free
    buildCommand: npm install --no-package-lock
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: baana-db
          property: connectionString

databases:
  - name: baana-db
    databaseName: baana
    user: baana
    plan: free
